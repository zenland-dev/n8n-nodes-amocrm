name: Bug report
description: Something in the node behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The n8n version and the version of this package.
      placeholder: "n8n 2.3.1, @zenland-dev/n8n-nodes-amocrm 0.2.1"
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Node, resource and operation
      placeholder: "amoCRM → Lead → Update"
    validations:
      required: true

  - type: dropdown
    id: credential
    attributes:
      label: Credential type
      options:
        - Access token
        - OAuth2
        - Not relevant
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: What amoCRM answered
      description: >
        The status code and the body of the error. Remove tokens, the client secret
        and personal data first — issues here are public.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        For a trigger problem, say whether the subscription is listed in
        amoCRM → Settings → Integrations.
